<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giterdun</title>
  <meta name="description" content="Our shared application planner.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="login" hidden></div>
  <div id="app" hidden>
    <nav id="nav"></nav>
    <main id="page">
      <div id="view"></div>
      <div id="stickers" aria-hidden="true"></div>
      <div id="cursors" aria-hidden="true"></div>
    </main>
    <div id="drawer" hidden></div>
    <div id="modal"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Giterdun needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
